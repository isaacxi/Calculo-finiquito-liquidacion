          <div>

            <div class="grid grid-cols-3 gap-2">
              <div class="col-span-2 relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span>

              </div>
              <select id="frecuencia" class="rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                <option value="mensual" selected>Mensual</option>
                <option value="quincenal">Quincenal</option>
                <option value="diario">Diario</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Ingreso</label>
              <input type="date" id="fechaIngreso" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de Salida</label>
              <input type="date" id="fechaSalida" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-blue-600">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Motivo de Salida</label>
            <select id="tipoBaja" class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-blue-600">
              <option value="renuncia" selected>Renuncia Voluntaria (Finiquito)</option>
              <option value="despido_injustificado">Despido Injustificado (Liquidación)</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Vacaciones Pendientes (Años prev.)</label>
              <input type="number" id="diasVacacionesPendientes" value="0" min="0" class="w-full rounded-lg border border-slate-200 p-2 text-sm text-slate-700">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Zona Salario Mínimo (Antigüedad)</label>
              <select id="zonaSalarioMinimo" class="w-full rounded-lg border border-slate-200 p-2 text-sm text-slate-700">
                <option value="general" selected>Resto del País ($315.04)</option>
                <option value="fronteraNorte">Frontera Norte ($440.87)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mt-4">
            <i data-lucide="calculator" class="w-5 h-5"></i>
            Calcular Prestaciones
          </button>
        </form>
